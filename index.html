<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./estilo/style.css">
    <link rel="shortcut icon" href="./imagens/ico.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">

    <title>Cyberpunk Vibes</title>
</head>
<body>
    <title>MP3 CYBERPUNK</title>

    <div class="player">
        <div class="scanlines"></div>
         <div class="cover" > <img src="./imagens/capa-1.gif" alt="" id="cover">
            <span class="cyber-tag">audio/hud</span>
        </div>

        
        <h2 id="title">Song Title</h2>
        <p id="artist">Artist</p>

        <div class="controls">
            <button id="prev" class="cyber-btn">⏪</button>
            <button id="play" class="cyber-btn play-btn">⏸</button>
            <button id="next" class="cyber-btn">⏩</button>
        

        </div>

        <div class="progress-bar-container" id="progress-bar-container">
         <div class="progress" id="progress">

         </div>
        </div>
    
    
    
    
    
    </div>


    <footer class="cyber-footer-tag">
        <script src="./script.js"></script>
    <p>[DEVELOPED BY <span class="hacker-name">DENJI    ]</span></p>    

    </footer>
</body>
</html>
